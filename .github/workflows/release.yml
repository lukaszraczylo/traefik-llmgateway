name: Release

on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".goreleaser.yaml"
      - "Dockerfile.goreleaser"
      - ".gitattributes"
      - ".traefik.yml"
      - "version.go"
      - "workflow-prepare.sh"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  release:
    uses: lukaszraczylo/shared-actions/.github/workflows/go-release.yaml@main
    with:
      go-version: "1.26.x"
      docker-enabled: true
    secrets: inherit
